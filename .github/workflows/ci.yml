name: CI
on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          cache: true

      - name: Sherif
        run: vp run sherif

      - name: Build
        run: vp run -r --cache build

      - name: Check
        run: vp check

      - name: Test
        run: vp run -r test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          cache: true

      - name: Install Playwright Chromium
        run: vp exec --filter @tests/e2e -- playwright install --with-deps chromium

      - name: Test E2E
        run: vp run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
