name: CI
on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          cache: true

      - name: Sherif
        run: vp run sherif

      - name: Build
        run: vp run -r --cache build

      - name: Check
        run: vp check

      - name: Test
        run: vp run -r test
